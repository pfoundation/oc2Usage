name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v26.9.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Sync version from tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag '$TAG' (expected v<semver>, e.g. v26.9.1)"
            exit 1
          fi
          echo "Syncing package version to $VERSION (from tag $TAG)"
          npm pkg set version="$VERSION"
          sed -E -i "s|usageTrackerWidget/[0-9A-Za-z.-]+|usageTrackerWidget/$VERSION|" src/providers.ts
          grep -q "usageTrackerWidget/$VERSION" src/providers.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run format:check
      - run: npm pack --dry-run
      - name: Publish to npm using OIDC
        run: npm publish --access public
