name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 26.9.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release commit + tag, create GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Validate version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: '${{ inputs.version }}' (expected semver, e.g. 26.9.0)"
            exit 1
          fi
          git fetch --tags
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag 'v${{ inputs.version }}' already exists"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - name: Bump version files
        run: |
          VERSION="${{ inputs.version }}"
          npm pkg set version="$VERSION"
          sed -E -i "s|usageTrackerWidget/[0-9A-Za-z.-]+|usageTrackerWidget/$VERSION|" src/providers.ts
          grep -q "usageTrackerWidget/$VERSION" src/providers.ts
          if PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            NOTES=$(git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)' --no-merges)
          else
            NOTES=$(git log -20 --pretty=format:'- %s (%h)' --no-merges)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- Release v$VERSION"
          fi
          { echo "# Changelog"; echo ""; echo "## $VERSION"; echo ""; echo "$NOTES"; echo ""; tail -n +3 CHANGELOG.md; } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run format:check
      - run: npm pack --dry-run
      - name: Commit, tag and push release
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/providers.ts CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:master "v$VERSION"
      # Publish here instead of relying on the tag push above: tags pushed
      # with the default GITHUB_TOKEN do not trigger other workflows.
      - name: Publish to npm using OIDC
        run: npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          NOTES=$(awk "/^## $VERSION\$/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md)
          gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES"
          echo "Released v$VERSION" >> "$GITHUB_STEP_SUMMARY"
